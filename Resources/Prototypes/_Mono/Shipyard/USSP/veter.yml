- type: vessel
  id: Veter
  parent: BaseVesselAntag
  name: PPU Veter
  description: A USSP stealth bomber, however it's at the cost of its size, speed, crew quarters and power generation method.
  price: 30000 #for its utility
  category: Medium
  group: Ussp
  access: USSP
  shuttlePath: /Maps/_Mono/Shuttles/USSP/veter.yml
  guidebookPage: Null
  class:
  - Bomber
  engine:
  - Solar
  addComponents:
  - type: SolarPoweredGrid
    doNotCull: true

