  id: Veter
  mapName: 'Veter'
  mapPath: /Maps/_Mono/Shuttles/USSP/veter.yml
  minPlayers: 0
  stations:
    Veter:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Veter USSP{1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            USSPSergeant: [0, 0]
            USSPCorporal: [0, 0]
            USSPMedic: [0, 0]
            USSPRifleman: [0, 0]
            USSPCommissar: [0, 0]
